name: Feature
description: Propose a new feature for the platform
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the feature from a functional point of view.

  - type: textarea
    id: description
    attributes:
      label: Functional description of the change
      description: What problem it solves, what behavior is expected and for whom.
      placeholder: Describe the change from the user's point of view.
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance criteria
      description: Verifiable list of conditions that must be met for the feature to be considered done.
      placeholder: |
        - [ ] Given ..., when ..., then ...
        - [ ] ...
    validations:
      required: true
