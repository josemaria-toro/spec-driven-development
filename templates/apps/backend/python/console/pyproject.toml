[project]
name = "backend"
version = "0.1.0"
description = "Backend application."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
backend = "app.interfaces.cli:main"

[dependency-groups]
dev = [
    "import-linter>=2.0",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C90", "SIM", "S", "RUF", "D1"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D1"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
packages = ["app"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: tests that use real adapters",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Hexagonal layers: interfaces and infrastructure -> application -> domain"
type = "layers"
layers = [
    "app.interfaces | app.infrastructure",
    "app.application",
    "app.domain",
]

[[tool.importlinter.contracts]]
name = "Domain and application do not import frameworks or I/O libraries"
type = "forbidden"
source_modules = [
    "app.domain",
    "app.application",
]
forbidden_modules = [
    "fastapi",
    "httpx",
    "pydantic",
    "sqlalchemy",
]
