[project]
name = "project-generator"
version = "0.1.0"
description = "Backend of the project generator: validated project specs and deterministic rendering."
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1",
]

[dependency-groups]
dev = [
    "import-linter>=2.0",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pyyaml>=6.0",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/project_generator"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C90", "SIM", "S", "RUF"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
packages = ["project_generator"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: tests that use real adapters (filesystem)",
]

[tool.coverage.run]
source = ["project_generator"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.importlinter]
root_package = "project_generator"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Hexagonal layers: infrastructure -> application -> domain"
type = "layers"
layers = [
    "project_generator.infrastructure",
    "project_generator.application",
    "project_generator.domain",
]

[[tool.importlinter.contracts]]
name = "Domain and application do not import frameworks or I/O libraries"
type = "forbidden"
source_modules = [
    "project_generator.domain",
    "project_generator.application",
]
forbidden_modules = [
    "jinja2",
    "yaml",
    "pydantic",
    "fastapi",
    "sqlalchemy",
    "httpx",
]
