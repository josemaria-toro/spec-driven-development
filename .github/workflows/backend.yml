name: Backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, to catch vulnerabilities published after the last commit.
    - cron: "37 4 * * 1"

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/backend

jobs:
  quality:
    name: Backend quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: apps/backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Format
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Types
        run: uv run mypy src

      - name: Layer dependency rule
        run: uv run lint-imports

      - name: Unit tests and coverage (80% minimum)
        run: uv run pytest tests/unit --cov --cov-fail-under=80

      - name: Integration tests
        run: uv run pytest tests/integration

  audit:
    name: Backend dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      # pip-audit fails on any known vulnerability, which is stricter than the
      # high/critical threshold of the guardrails.
      - name: Audit locked dependencies
        run: uv export --frozen --no-hashes --no-emit-project | uvx pip-audit -r /dev/stdin --disable-pip --no-deps
