name: Frontend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, to catch vulnerabilities published after the last commit.
    - cron: "47 4 * * 1"

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/frontend

jobs:
  quality:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      # Node 20 is the minimum supported version (see harness/adr/0001).
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: apps/frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: apps/frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint (types, accessibility, security, layer rule)
        run: pnpm lint

      - name: Types
        run: pnpm typecheck

      - name: Unit tests and coverage (80% minimum)
        run: pnpm test:unit --coverage

      - name: Integration tests
        run: pnpm test:integration

  e2e:
    name: Frontend e2e and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: apps/frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: apps/frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests at mobile, tablet and desktop widths
        run: pnpm e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/frontend/playwright-report/
          retention-days: 7

  audit:
    name: Frontend dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: apps/frontend/.nvmrc

      # High and critical block; medium and low are triaged separately.
      - name: Audit dependencies
        run: pnpm audit --audit-level high
