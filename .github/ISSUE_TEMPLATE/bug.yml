name: Bug
description: Report a bug or incorrect behavior in the platform
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the bug in as much detail as possible.

  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: What happens, what was expected to happen and what the impact is.
      placeholder: Describe the observed and the expected behavior.
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      description: Environment where the bug occurred.
      options:
        - Development
        - Pre-Release
        - Production
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: Impact of the bug on users and the platform.
      options:
        - Low
        - Medium
        - High
        - Critical
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact sequence of actions that triggers the bug.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance criteria
      description: Verifiable list of conditions that must be met for the bug to be considered resolved.
      placeholder: |
        - [ ] Given ..., when ..., then ...
        - [ ] ...
    validations:
      required: true
